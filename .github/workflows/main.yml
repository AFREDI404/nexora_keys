name: Build Nexora Keys

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Check project files
    run: |
      echo "NEXORA KEYS repository is ready."
      echo "Android project setup will be added next."
      ls -la
